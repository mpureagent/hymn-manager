<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>赞美诗歌本</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f1e9;
        --surface: #fffdf8;
        --surface-soft: #faf7f0;
        --ink: #24211c;
        --muted: #6f675b;
        --faint: #9a9183;
        --line: #ddd5c6;
        --line-soft: #eee7da;
        --accent: #7d3b2f;
        --accent-soft: #f0e3d8;
        --focus: #7d3b2f;
        --row-height: 44px;

        /* 预览区样式变量：只由 shared/style.ts 的 styleToCssVars() 覆盖 */
        --hymn-font-family: "Noto Serif CJK SC", "Source Han Serif SC", "SimSun",
          "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
        --hymn-font-size: 48px;
        --hymn-line-height: 1.6;
        --hymn-ink: #2b2118;
        --hymn-bg: #f5f0e6;
        --hymn-ink-soft: rgba(43, 33, 24, 0.58);
        --hymn-rule: rgba(43, 33, 24, 0.16);
        --hymn-align: center;
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        display: grid;
        grid-template-rows: auto 1fr;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC",
          "Noto Sans CJK SC", system-ui, sans-serif;
        font-size: 14px;
      }

      /* 顶部栏：选本 → 搜索 → 样式 → 投屏，四个独立控件 */
      .topbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 18px;
        background: var(--surface-soft);
        border-bottom: 1px solid var(--line);
      }

      .book-select,
      .search-input,
      .tool-btn {
        height: 40px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--surface);
        color: var(--ink);
        font: inherit;
      }

      .book-select {
        flex: 0 0 auto;
        width: 260px;
        padding: 0 34px 0 12px;
        font-weight: 600;
        cursor: pointer;
      }

      .search-input {
        flex: 1 1 auto;
        min-width: 180px;
        max-width: 560px;
        padding: 0 14px;
        outline: none;
      }

      .search-input::placeholder {
        color: var(--faint);
      }

      .book-select:focus-visible,
      .search-input:focus {
        outline: 2px solid var(--focus);
        outline-offset: -1px;
      }

      .spacer {
        flex: 1 1 auto;
      }

      .tool-btn {
        flex: 0 0 auto;
        min-width: 72px;
        padding: 0 16px;
        cursor: pointer;
      }

      .tool-btn:hover:not(:disabled) {
        background: var(--accent-soft);
      }

      .tool-btn:disabled {
        color: var(--faint);
        cursor: not-allowed;
        background: #f2eee5;
      }

      .tool-btn.active {
        border-color: var(--accent);
        background: var(--accent);
        color: #fffaf3;
      }

      .tool-btn.active:hover:not(:disabled) {
        background: #6a3026;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 30px;
        z-index: 60;
        max-width: min(520px, 90vw);
        padding: 10px 18px;
        transform: translateX(-50%);
        border-radius: 999px;
        background: rgba(36, 33, 28, 0.92);
        color: #fdf8ee;
        font-size: 13px;
        letter-spacing: 0.04em;
        text-align: center;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.2);
        pointer-events: none;
      }

      .layout {
        display: grid;
        grid-template-columns: 340px minmax(0, 1fr);
        min-height: 0;
      }

      .list-pane {
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: var(--surface);
        border-right: 1px solid var(--line);
      }

      .pane-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 18px;
        border-bottom: 1px solid var(--line-soft);
        font-size: 12px;
        letter-spacing: 0.08em;
        color: var(--muted);
      }

      .pane-head strong {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--ink);
      }

      .list-stage {
        position: relative;
        display: flex;
        flex: 1 1 auto;
        min-height: 0;
      }

      .list-viewport {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        outline: none;
        overscroll-behavior: contain;
      }

      .list-empty {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 28px;
        background: var(--surface);
        text-align: center;
      }

      .list-empty-title {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      .list-empty-hint {
        margin: 0;
        color: var(--faint);
        font-size: 12.5px;
        line-height: 1.7;
      }

      .vl-spacer {
        width: 1px;
        pointer-events: none;
      }

      .vl-layer {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
      }

      .hymn-row {
        position: absolute;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 0 16px 0 18px;
        overflow: hidden;
        border: 0;
        border-bottom: 1px solid var(--line-soft);
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }

      .hymn-row:hover {
        background: #f7f2e8;
      }

      .hymn-row:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: -2px;
      }

      .hymn-row.selected {
        background: var(--accent-soft);
        box-shadow: inset 3px 0 0 var(--accent);
      }

      .hymn-row-num {
        flex: 0 0 auto;
        min-width: 52px;
        padding: 2px 8px;
        border: 1px solid var(--line-soft);
        border-radius: 999px;
        background: var(--surface-soft);
        color: var(--muted);
        font-size: 11.5px;
        font-variant-numeric: tabular-nums;
        text-align: center;
        white-space: nowrap;
      }

      .hymn-row-main {
        display: flex;
        flex: 1 1 auto;
        flex-direction: column;
        justify-content: center;
        gap: 2px;
        min-width: 0;
        overflow: hidden;
      }

      .hymn-row-title-line {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .hymn-row-title {
        flex: 0 1 auto;
        overflow: hidden;
        font-size: 15px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .hymn-row-tag {
        flex: 0 0 auto;
        padding: 1px 6px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 10.5px;
        letter-spacing: 0.04em;
      }

      .hymn-row-excerpt {
        overflow: hidden;
        color: var(--muted);
        font-size: 12.5px;
        line-height: 1.4;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      mark {
        padding: 0 1px;
        border-radius: 2px;
        background: #f1d69a;
        color: inherit;
      }

      /* 侧栏底部历史区 */
      .history {
        flex: 0 0 auto;
        border-top: 1px solid var(--line);
        background: var(--surface-soft);
      }

      .history-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 6px 12px 6px 14px;
      }

      .history-toggle {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 2px;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: var(--ink);
        font: inherit;
        font-weight: 600;
        letter-spacing: 0.06em;
        cursor: pointer;
      }

      .history-chevron {
        display: inline-block;
        color: var(--faint);
        font-size: 11px;
        transition: transform 0.15s ease;
      }

      .history-toggle[aria-expanded="false"] .history-chevron {
        transform: rotate(-90deg);
      }

      .history-clear {
        padding: 4px 9px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--surface);
        color: var(--muted);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }

      .history-clear:hover:not(:disabled) {
        border-color: #d9b3a5;
        color: var(--accent);
      }

      .history-clear.danger {
        border-color: var(--accent);
        background: var(--accent);
        color: #fffaf3;
      }

      .history-clear:disabled {
        color: var(--faint);
        cursor: not-allowed;
        opacity: 0.7;
      }

      .history-toggle:focus-visible,
      .history-clear:focus-visible,
      .history-chip:focus-visible,
      .history-item:focus-visible,
      .history-more:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 1px;
      }

      .history-body {
        max-height: 34vh;
        padding: 4px 14px 14px;
        overflow-y: auto;
        border-top: 1px solid var(--line-soft);
        overscroll-behavior: contain;
      }

      .history-block + .history-block {
        margin-top: 14px;
      }

      .history-subhead {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin: 8px 0;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.12em;
      }

      .history-count {
        color: var(--faint);
        font-weight: 400;
        letter-spacing: 0;
      }

      .history-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .history-chip {
        max-width: 100%;
        padding: 4px 10px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--surface);
        color: var(--ink);
        font: inherit;
        font-size: 12.5px;
        text-overflow: ellipsis;
        white-space: nowrap;
        cursor: pointer;
      }

      .history-chip:hover {
        border-color: #d9b3a5;
        background: var(--accent-soft);
      }

      .history-empty {
        margin: 0;
        padding: 6px 0;
        color: var(--faint);
        font-size: 12px;
      }

      .history-list {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .history-item {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 7px 8px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }

      .history-item:hover {
        background: #f1ebde;
      }

      .history-item-num {
        flex: 0 0 auto;
        min-width: 48px;
        color: var(--muted);
        font-size: 11.5px;
        font-variant-numeric: tabular-nums;
      }

      .history-item-main {
        display: flex;
        flex-direction: column;
        gap: 1px;
        min-width: 0;
      }

      .history-item-title {
        overflow: hidden;
        font-size: 13.5px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .history-item-meta {
        color: var(--faint);
        font-size: 11px;
      }

      .history-more {
        width: 100%;
        margin-top: 8px;
        padding: 6px;
        border: 1px dashed var(--line);
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }

      .history-more:hover {
        background: var(--surface);
        color: var(--ink);
      }

      .preview-pane {
        display: flex;
        align-items: stretch;
        justify-content: center;
        min-width: 0;
        overflow: hidden;
        background: var(--hymn-bg);
        color: var(--hymn-ink);
        transition:
          background-color 0.18s ease,
          color 0.18s ease;
      }

      .preview-empty {
        align-self: center;
        max-width: 520px;
        padding: 48px;
        text-align: var(--hymn-align);
      }

      .preview-panel {
        display: flex;
        flex: 1 1 auto;
        flex-direction: column;
        width: 100%;
        max-width: 880px;
        min-height: 0;
        padding: 36px 56px 0;
      }

      .preview-head {
        flex: 0 0 auto;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--hymn-rule);
        text-align: var(--hymn-align);
      }

      .preview-mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 54px;
        height: 54px;
        margin-bottom: 18px;
        border: 1px solid var(--hymn-rule);
        border-radius: 50%;
        background: transparent;
        color: var(--hymn-ink-soft);
        font-family: Georgia, serif;
        font-size: 26px;
      }

      .preview-empty p {
        margin: 0;
      }

      .preview-empty-title {
        font-size: 17px;
        letter-spacing: 0.12em;
      }

      .preview-hint {
        margin-top: 10px !important;
        color: var(--hymn-ink-soft);
        font-size: 12px;
        line-height: 1.7;
      }

      .preview-eyebrow {
        margin: 0;
        color: var(--hymn-ink-soft);
        font-size: 12px;
        letter-spacing: 0.18em;
      }

      .preview-title {
        margin: 12px 0 0;
        color: var(--hymn-ink);
        font-family: var(--hymn-font-family);
        font-size: 30px;
        font-weight: 600;
        letter-spacing: 0.06em;
      }

      .preview-alt {
        margin: 8px 0 0;
        color: var(--hymn-ink-soft);
        font-size: 14px;
        letter-spacing: 0.04em;
      }

      .lyrics-body {
        flex: 1 1 auto;
        min-height: 0;
        padding: 22px 0 56px;
        overflow-x: hidden;
        overflow-y: auto;
        outline: none;
        overscroll-behavior: contain;
        scrollbar-gutter: stable;
        text-align: var(--hymn-align);
      }

      .lyrics-body:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 4px;
      }

      .lyric-verse + .lyric-verse {
        margin-top: 24px;
      }

      .verse-label {
        display: block;
        margin-bottom: 4px;
        color: var(--hymn-ink-soft);
        font-size: 11px;
        letter-spacing: 0.18em;
      }

      .lyric-line {
        margin: 0;
        color: var(--hymn-ink);
        font-family: var(--hymn-font-family);
        font-size: var(--hymn-font-size);
        line-height: var(--hymn-line-height);
        letter-spacing: 0.035em;
        overflow-wrap: anywhere;
      }

      .lyrics-missing {
        padding: 6px 0;
      }

      .lyrics-missing-title {
        margin: 0;
        color: var(--hymn-ink);
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.04em;
      }

      .lyrics-missing-hint {
        margin: 10px 0 18px;
        color: var(--hymn-ink-soft);
        line-height: 1.7;
      }

      .lyrics-missing-action {
        height: 36px;
        padding: 0 16px;
        border: 1px solid var(--hymn-rule);
        border-radius: 7px;
        background: transparent;
        color: var(--hymn-ink-soft);
        font: inherit;
        cursor: not-allowed;
      }

      /* 样式抽屉：右侧滑出，遮罩点击关闭 */
      .style-overlay {
        position: fixed;
        inset: 0;
        z-index: 40;
      }

      .style-mask {
        position: absolute;
        inset: 0;
        background: rgba(35, 28, 20, 0.34);
        animation: style-mask-in 0.18s ease-out;
      }

      .style-panel {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        width: min(400px, 94vw);
        border-left: 1px solid var(--line);
        background: var(--surface);
        box-shadow: -18px 0 48px rgba(69, 56, 40, 0.18);
        animation: style-panel-in 0.2s ease-out;
        outline: none;
      }

      @keyframes style-mask-in {
        from {
          opacity: 0;
        }
      }

      @keyframes style-panel-in {
        from {
          transform: translateX(100%);
        }
      }

      .style-panel-head {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 18px;
        border-bottom: 1px solid var(--line);
      }

      .style-panel-title {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.08em;
      }

      .style-close {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--surface-soft);
        color: var(--muted);
        font: inherit;
        font-size: 20px;
        line-height: 1;
        cursor: pointer;
      }

      .style-close:hover {
        border-color: #d9b3a5;
        color: var(--accent);
      }

      .style-close:focus-visible,
      .style-preset:focus-visible,
      .style-swatch:focus-visible,
      .style-segmented button:focus-visible,
      .style-reset:focus-visible,
      .style-select:focus-visible,
      .style-number:focus-visible,
      .style-color-input:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }

      .style-panel-body {
        flex: 1 1 auto;
        padding: 4px 18px 26px;
        overflow-y: auto;
        overscroll-behavior: contain;
      }

      .style-section {
        padding: 16px 0;
        border-bottom: 1px solid var(--line-soft);
      }

      .style-section-title {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.14em;
      }

      .style-preset-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }

      .style-preset {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 7px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface-soft);
        color: var(--ink);
        font: inherit;
        cursor: pointer;
      }

      .style-preset:hover {
        border-color: #d9b3a5;
      }

      .style-preset.active {
        border-color: var(--accent);
        box-shadow: inset 0 0 0 1px var(--accent);
      }

      .style-preset-preview {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 34px;
        border: 1px solid var(--line-soft);
        border-radius: 5px;
        background: var(--preset-bg);
        color: var(--preset-ink);
        font-family: var(--hymn-font-family);
        font-size: 17px;
      }

      .style-preset-label {
        font-size: 11.5px;
        text-align: center;
      }

      .style-sample {
        margin-top: 2px;
        padding: 12px 14px 14px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--hymn-bg);
        color: var(--hymn-ink);
      }

      .style-sample-label {
        display: block;
        color: var(--hymn-ink-soft);
        font-size: 10px;
        letter-spacing: 0.16em;
      }

      .style-sample-text {
        margin: 4px 0 0;
        font-family: var(--hymn-font-family);
        font-size: clamp(20px, calc(var(--hymn-font-size) * 0.46), 52px);
        line-height: var(--hymn-line-height);
        text-align: var(--hymn-align);
        overflow-wrap: anywhere;
      }

      .style-field {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 11px;
      }

      .style-field:last-child {
        margin-bottom: 0;
      }

      .style-field-stack {
        align-items: stretch;
        flex-direction: column;
        gap: 6px;
      }

      .style-label {
        flex: 0 0 auto;
        color: var(--ink);
        font-size: 13px;
      }

      .style-select {
        flex: 1 1 auto;
        min-width: 0;
        height: 34px;
        padding: 0 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        color: var(--ink);
        font: inherit;
        font-size: 13px;
      }

      .style-range-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .style-range {
        flex: 1 1 auto;
        min-width: 0;
        accent-color: var(--accent);
        cursor: pointer;
      }

      .style-number {
        flex: 0 0 auto;
        width: 64px;
        height: 32px;
        padding: 0 6px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        color: var(--ink);
        font: inherit;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      .style-value {
        flex: 0 0 auto;
        min-width: 32px;
        color: var(--muted);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      .style-unit {
        color: var(--faint);
        font-size: 12px;
      }

      .style-segmented {
        display: flex;
        flex: 0 0 auto;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 6px;
      }

      .style-segmented button {
        height: 32px;
        padding: 0 14px;
        border: 0;
        border-left: 1px solid var(--line);
        background: var(--surface);
        color: var(--muted);
        font: inherit;
        font-size: 12.5px;
        cursor: pointer;
      }

      .style-segmented button:first-child {
        border-left: 0;
      }

      .style-segmented button[aria-pressed="true"] {
        background: var(--accent);
        color: #fffaf3;
      }

      .style-color-grid {
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        gap: 6px;
      }

      .style-swatch {
        width: 100%;
        aspect-ratio: 1;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 5px;
        cursor: pointer;
      }

      .style-swatch:hover {
        transform: scale(1.08);
      }

      .style-swatch.active {
        box-shadow:
          0 0 0 2px var(--surface),
          0 0 0 4px var(--accent);
      }

      .style-color-custom {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 11px;
      }

      .style-color-input {
        width: 46px;
        height: 30px;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: transparent;
        cursor: pointer;
      }

      .style-reset {
        width: 100%;
        height: 38px;
        margin-top: 18px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--surface-soft);
        color: var(--ink);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }

      .style-reset:hover {
        border-color: #d9b3a5;
        color: var(--accent);
      }

      /* 数据包引导页 */
      .guide {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 0;
        padding: 40px;
        overflow-y: auto;
      }

      .guide-card {
        width: min(720px, 100%);
        padding: 34px 38px 32px;
        border: 1px solid var(--line);
        border-top: 4px solid var(--accent);
        border-radius: 10px;
        background: var(--surface);
        box-shadow: 0 18px 48px rgba(69, 56, 40, 0.08);
      }

      .guide-eyebrow {
        margin: 0 0 10px;
        color: var(--accent);
        font-size: 12px;
        letter-spacing: 0.18em;
      }

      .guide-card h1 {
        margin: 0;
        font-family: "Noto Serif CJK SC", "Source Han Serif SC", "SimSun", serif;
        font-size: 25px;
        font-weight: 600;
        letter-spacing: 0.04em;
      }

      .guide-desc {
        margin: 12px 0 0;
        color: var(--muted);
        line-height: 1.8;
      }

      .guide-subhead {
        margin: 26px 0 8px;
        font-size: 13px;
        font-weight: 600;
      }

      .guide-paths {
        margin: 0;
        padding: 0;
        list-style: none;
        border: 1px solid var(--line-soft);
        border-radius: 7px;
        overflow: hidden;
      }

      .guide-paths li {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 13px;
        background: var(--surface-soft);
        border-bottom: 1px solid var(--line-soft);
      }

      .guide-paths li:last-child {
        border-bottom: 0;
      }

      .path-index {
        flex: 0 0 20px;
        color: var(--faint);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }

      .guide-paths code {
        flex: 1 1 auto;
        overflow-wrap: anywhere;
        color: var(--ink);
        font-family: "Cascadia Mono", Consolas, ui-monospace, monospace;
        font-size: 12.5px;
        user-select: text;
      }

      .path-tag {
        flex: 0 0 auto;
        padding: 2px 7px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 11px;
      }

      .guide-error {
        margin: 16px 0 0;
        padding: 11px 13px;
        border: 1px solid #e6c9bd;
        border-radius: 7px;
        background: #fbf0ea;
        color: #6d2d21;
        font-size: 12.5px;
        line-height: 1.7;
        overflow-wrap: anywhere;
        user-select: text;
      }

      .guide-actions {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: 24px;
      }

      .primary-btn {
        height: 40px;
        padding: 0 22px;
        border: 1px solid var(--accent);
        border-radius: 7px;
        background: var(--accent);
        color: #fffaf3;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      .primary-btn:hover:not(:disabled) {
        background: #6a3026;
      }

      .primary-btn:disabled {
        opacity: 0.6;
        cursor: wait;
      }

      .guide-note {
        color: var(--faint);
        font-size: 12px;
      }

      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .preview-pane {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <select id="book-select" class="book-select" aria-label="选择诗歌本"></select>
      <input
        id="search-input"
        class="search-input"
        type="search"
        placeholder="输入编号或歌名"
        aria-label="输入编号或歌名"
        autocomplete="off"
        spellcheck="false"
        disabled
      />
      <div class="spacer"></div>
      <button id="btn-style" class="tool-btn" type="button" disabled title="样式设置">样式</button>
      <button
        id="btn-project"
        class="tool-btn"
        type="button"
        disabled
        aria-pressed="false"
        title="投屏当前诗歌（F5 / Ctrl+P）"
      >
        投屏
      </button>
    </header>

    <main id="app" class="layout" hidden>
      <section class="list-pane">
        <div class="pane-head">
          <strong id="list-heading">全目录</strong>
          <span id="catalog-count" aria-live="polite"></span>
        </div>
        <div class="list-stage">
          <div id="hymn-list" class="list-viewport" role="listbox" aria-label="诗歌目录"></div>
          <div id="list-empty" class="list-empty" hidden>
            <p id="list-empty-title" class="list-empty-title"></p>
            <p class="list-empty-hint">试试输入编号，或只输入标题中的两三个字</p>
          </div>
        </div>
        <section class="history" aria-label="历史记录">
          <header class="history-head">
            <button
              id="history-toggle"
              class="history-toggle"
              type="button"
              aria-expanded="true"
              aria-controls="history-body"
            >
              <span class="history-chevron" aria-hidden="true">▾</span>
              <span>历史</span>
            </button>
            <button id="history-clear" class="history-clear" type="button" disabled>
              清空历史
            </button>
          </header>
          <div id="history-body" class="history-body">
            <section class="history-block">
              <h3 class="history-subhead"><span>搜索记录</span></h3>
              <div id="search-chips" class="history-chips"></div>
              <p id="search-chips-empty" class="history-empty">暂无搜索记录</p>
            </section>
            <section class="history-block">
              <h3 class="history-subhead">
                <span>打开记录</span>
                <span id="opened-count" class="history-count"></span>
              </h3>
              <ul id="opened-list" class="history-list"></ul>
              <p id="opened-empty" class="history-empty">暂无打开记录</p>
              <button id="history-more" class="history-more" type="button" hidden>
                展开全部
              </button>
            </section>
          </div>
        </section>
      </section>
      <section class="preview-pane">
        <div id="preview-empty" class="preview-empty">
          <div class="preview-mark" aria-hidden="true">♪</div>
          <p class="preview-empty-title">选择左侧诗歌</p>
          <p class="preview-hint">输入编号或歌名，或从目录中选择一首</p>
        </div>
        <article id="preview-panel" class="preview-panel" hidden aria-labelledby="preview-title">
          <header class="preview-head">
            <p id="preview-eyebrow" class="preview-eyebrow"></p>
            <h2 id="preview-title" class="preview-title"></h2>
            <p id="preview-alt" class="preview-alt" hidden></p>
          </header>
          <div id="lyrics-body" class="lyrics-body" tabindex="0" aria-label="歌词"></div>
        </article>
      </section>
    </main>

    <section id="guide" class="guide" hidden>
      <div class="guide-card">
        <p class="guide-eyebrow">数据包 · HYMNS-DATA</p>
        <h1 id="guide-title">未找到数据包</h1>
        <p id="guide-desc" class="guide-desc"></p>
        <p class="guide-subhead">请把 hymns-data 文件夹放到以下任一位置（推荐位置已标记）：</p>
        <ol id="guide-paths" class="guide-paths"></ol>
        <p id="guide-error" class="guide-error" hidden></p>
        <div class="guide-actions">
          <button id="guide-retry" class="primary-btn" type="button">重新检测</button>
          <span class="guide-note">数据包与程序分离，应用本身不内置诗歌数据。</span>
        </div>
      </div>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
