<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>赞美诗歌本 · 投屏</title>
    <style>
      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #11161b;
        color: #e8dcc2;
        font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC",
          "Noto Sans CJK SC", system-ui, sans-serif;
      }

      .stage {
        text-align: center;
      }

      .stage-mark {
        margin: 0;
        color: #b08d57;
        font-family: Georgia, serif;
        font-size: 64px;
        line-height: 1;
      }

      .stage-title {
        margin: 22px 0 0;
        font-family: "Noto Serif CJK SC", "Source Han Serif SC", "SimSun", serif;
        font-size: 34px;
        font-weight: 500;
        letter-spacing: 0.12em;
      }

      .stage-hint {
        margin: 14px 0 0;
        color: #7f8a94;
        font-size: 15px;
        letter-spacing: 0.06em;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <p class="stage-mark" aria-hidden="true">♪</p>
      <h1 class="stage-title">投屏窗口</h1>
      <p class="stage-hint">投屏内容将在后续版本接入</p>
    </div>
  </body>
</html>
