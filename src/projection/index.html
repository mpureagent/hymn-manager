<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>赞美诗歌本 · 投屏</title>
    <style>
      :root {
        color-scheme: light;

        /* 投屏样式变量：只由 shared/style.ts 的 styleToCssVars() 覆盖 */
        --hymn-font-family: "Noto Serif CJK SC", "Source Han Serif SC", "SimSun",
          "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
        --hymn-font-size: 48px;
        --hymn-line-height: 1.6;
        --hymn-ink: #2b2118;
        --hymn-bg: #f5f0e6;
        --hymn-ink-soft: rgba(43, 33, 24, 0.58);
        --hymn-rule: rgba(43, 33, 24, 0.16);
        --hymn-align: center;
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: var(--hymn-bg);
        color: var(--hymn-ink);
        font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC",
          "Noto Sans CJK SC", system-ui, sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }

      .stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 6vh 6vw 10vh;
      }

      .page {
        width: 100%;
        max-width: 92vw;
        text-align: var(--hymn-align);
      }

      .lines {
        display: flex;
        flex-direction: column;
        text-align: var(--hymn-align);
      }

      .lyric-line {
        margin: 0;
        color: var(--hymn-ink);
        font-family: var(--hymn-font-family);
        font-size: var(--hymn-font-size);
        line-height: var(--hymn-line-height);
        letter-spacing: 0.035em;
        overflow-wrap: anywhere;
      }

      .empty {
        margin: 0;
        padding: 0 6vw;
        color: var(--hymn-ink-soft);
        font-size: clamp(20px, 2.6vw, 38px);
        letter-spacing: 0.1em;
        line-height: 1.7;
        text-align: center;
      }

      /* 页码常驻底部；控制条浮在其上方，两者不重叠 */
      .indicator {
        position: fixed;
        left: 50%;
        bottom: 2.4vh;
        margin: 0;
        transform: translateX(-50%);
        color: var(--hymn-ink-soft);
        font-size: clamp(13px, 1.15vw, 20px);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.14em;
        opacity: 0.6;
        pointer-events: none;
      }

      .controls {
        position: fixed;
        left: 50%;
        bottom: 7.5vh;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 7px 10px;
        transform: translateX(-50%);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        background: rgba(18, 20, 24, 0.76);
        color: #f5f0e6;
        font-size: 14px;
        letter-spacing: 0.04em;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.16s ease;
        backdrop-filter: blur(10px);
      }

      .controls.visible {
        opacity: 1;
        pointer-events: auto;
      }

      .controls button {
        padding: 7px 11px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
        white-space: nowrap;
      }

      .controls button:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.14);
      }

      .controls button:focus-visible {
        outline: 2px solid #f5f0e6;
        outline-offset: 1px;
      }

      .controls button:disabled {
        opacity: 0.32;
        cursor: default;
      }

      .controls .page-label {
        min-width: 3.6em;
        padding: 0 2px;
        color: #f5f0e6;
        font-variant-numeric: tabular-nums;
        text-align: center;
      }

      .controls .fit-hint {
        padding: 0 4px;
        color: #f0c9b8;
        font-size: 12px;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }

      .controls .divider {
        width: 1px;
        height: 16px;
        margin: 0 4px;
        background: rgba(255, 255, 255, 0.2);
      }

      .controls .exit {
        color: #f0c9b8;
      }
    </style>
  </head>
  <body>
    <main id="stage" class="stage" aria-live="polite">
      <section id="page" class="page" hidden>
        <div id="lines" class="lines"></div>
      </section>
      <p id="empty" class="empty" hidden>等待主窗口投屏</p>
    </main>

    <p id="indicator" class="indicator" hidden></p>

    <nav id="controls" class="controls" aria-label="投屏控制" aria-hidden="true">
      <button type="button" data-action="prev-hymn">上一首</button>
      <span class="divider" aria-hidden="true"></span>
      <button type="button" data-action="prev-page">上一页</button>
      <span id="control-page" class="page-label">1/1</span>
      <button type="button" data-action="next-page">下一页</button>
      <span id="fit-hint" class="fit-hint" hidden></span>
      <span class="divider" aria-hidden="true"></span>
      <button type="button" data-action="next-hymn">下一首</button>
      <span class="divider" aria-hidden="true"></span>
      <button type="button" data-action="exit" class="exit">退出</button>
    </nav>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
